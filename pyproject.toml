[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-solver"
version = "1.0.0"
description = "Rule-first exact math solver backed by SymPy and Z3"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "math-solver contributors" }]
dependencies = [
    "sympy>=1.12",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
math-solver = "app.cli:main"
math-solver-web = "app.web:main"

[tool.setuptools]
packages = ["app", "solver"]

[tool.setuptools.package-data]
app = [
    "assets/*",
    "assets/katex/*",
    "assets/katex/fonts/*",
]
